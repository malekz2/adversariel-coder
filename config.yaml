# Adversarial Maker <-> Solver: all settings live here.
# Anything you pass on the command line (e.g. --steps 50) overrides these values.

run:
  name: run1                 # outputs go to runs/<name>/  (log.txt and train.png are written to the project folder too)
  total_steps: 200           # one step = Maker writes puzzles -> Solver attempts them -> both adapters update once
  log_every: 1               # overwrite log.txt + train.png every N steps
  checkpoint_every: 5        # save adapters + optimiser + state every N steps (resume picks the latest)
  keep_checkpoints: 3
  time_budget_hours: 3       # HARD limit for the whole run (incl. model loading, across resumes): no step starts
                             # unless it should finish in time. total_steps is then just an upper cap. 0 = off.
  max_hours: 0               # stop cleanly after this many hours of THIS session (0 = no limit)
  seed: 0

# auto = check_hardware decides (mac_mlx / cuda_large / cuda_mid / cuda_small / cpu / cpu_small / cpu_tiny); or force one
profile: auto

profiles:
  mac_mlx:                   # Apple Silicon Mac (e.g. your M5 MacBook): two DIFFERENT models, both 4-bit MLX
    backend: mlx
    maker_repo: openbmb/MiniCPM5-2B-MLX                # Maker: MiniCPM5-2B, 4-bit (official OpenBMB MLX build, 1.4 GB)
    solver_repo: mlx-community/K2-Horizon-3.7B-4bit    # Solver: K2-Horizon-3.7B, 4-bit (4.1 GB; ships k2_horizon.py)
    trust_remote_code: true
    reasoning_effort: low    # K2-Horizon: short <ifm|think_faster> thinking; MiniCPM5 ignores it
    grad_checkpoint: true    # recompute activations in backward instead of storing them (16 GB unified memory)
    parallel_slots: 4        # Pi attempts in flight; MLX generates one sequence at a time
    max_seq_len: 4096        # longest sequence trained on (activation memory grows with length)
    ctx_per_slot: 4096       # Pi episodes are cut at this length, so they stay trainable
    safety:                  # stop cleanly (checkpoint saved) instead of freezing the Mac
      mlx_memory_fraction: 0.6               # cap MLX at 60 % of RAM (its default is MORE than the Mac has)
      min_free_percent: 15                   # macOS's own free-memory % (counts reclaimable cache as free);
                                             # stops at "critical" pressure, or "warning" below this
      max_swap_growth_gb: 2.0
      min_free_disk_gb: 10.0                 # macOS swaps to disk; too little free disk = frozen machine
    overrides:
      decision.d3_repo: ggml-org/vllm-d3-nano-GGUF    # d3-nano (2.2B) instead of d3-flash: fits next to both models
      decision.d3_file: vllm-d3-nano-Q8_0.gguf        # official quantised build, 2.55 GB
      decision.gpu_layers: all                         # Metal; only loaded while the referee is consulted
  cuda_large:                # NVIDIA GPU with >= 24 GB (e.g. RTX 4090, Purdue LWSN B131) + >= 32 GB RAM: the real experiment
    train_repo: unsloth/Qwen3.8-27B            # BF16 safetensors, quantised to 4-bit NF4 while loading (QLoRA)
    gguf_repo: unsloth/Qwen3.8-27B-GGUF
    gguf_file: Qwen3.8-27B-UD-IQ4_XS.gguf     # your chosen rollout quant (14.3 GB)
    reasoning_effort: low    # Qwen3.8: xhigh | medium | low
    quant_4bit: true         # trainer in VRAM: 12.6 GB of 4-bit layers + 5.1 GB of 16-bit embeddings/output layer
    dtype: bfloat16
    optimizer: paged_adamw_8bit                # QLoRA's paged 8-bit Adam: ~4x smaller optimizer state
    offload_activations: true                  # saved activations live in pinned RAM, not VRAM (~5 GB at 8k tokens)
    offload_trainer_during_rollouts: true      # trainer (~19 GB) waits in RAM while llama.cpp uses the GPU
    llama_build: cuda
    llama_gpu_layers: all    # the trainer is parked in RAM during rollouts, so the whole 27B fits on the GPU
    parallel_slots: 8        # Pi attempts generating at once (the self-test may pick fewer if speculation wins)
    llama_extra_args: ["-fa", "on", "--fit", "off", "--cache-ram", "1024"]
                             # --fit off: one 4090 report saw erratic 9-20 tok/s with fit on; cap RAM prompt cache
    ctx_checkpoints: 3       # saved DeltaNet states per slot for prompt reuse (~150 MB of RAM each on the 27B;
    checkpoint_min_step: 512 #   the old 32 per slot could take ~40 GB of RAM with 8 slots -> Windows paging)
    min_decode_tps: 12       # a healthy 4090 does ~40 tok/s per stream; below this the GPU memory has overflowed
                             # into RAM, so llama-server is restarted with smaller settings (README: 4090 speed)
    vram_headroom_gb: 1.5    # the self-test only picks settings that leave this much VRAM free (the parked
                             # trainer keeps ~1 GB of CUDA state on the GPU during rollouts)
    kv_cache_types: ["q8_0", "q4_0", "f16"]   # setup's self-test times each at full concurrency and keeps the
                                               # fastest (one report: non-q4 KV can silently fall back to CPU)
    swap_engine_during_training: true          # llama-server is stopped while the trainer is on the GPU
    max_seq_len: 8192
    ctx_per_slot: 8192
    overrides:               # applied to the rest of this file when this profile is active
      grpo.puzzles_per_step: 8                 # fewer, bigger steps: fixed per-step costs are paid less often
    speculative:             # faster rollouts, same output: the 27B verifies every drafted token
      draft_repo: z-lab/Qwen3.8-27B-DFlash2-GGUF   # DFlash2 block drafter from the DFlash authors
      draft_file: Qwen3.8-27B-DFlash2-Q4_K_M.gguf  # 1.1 GB; ~5.3 tokens accepted per 27B pass (greedy benchmark)
      candidates:            # the self-test checks each with our LoRA and times it at real concurrency
        - {type: "draft-mtp,ngram-mod", n_max: 3}     # MTP head is built into Unsloth's GGUF (no extra file)
        - {type: "draft-mtp", n_max: 3}
        - {type: "draft-dflash,ngram-mod", n_max: 7}
        - {type: "draft-dflash", n_max: 7}
        - {type: "ngram-mod"}                         # n-gram lookup only (copies text already in the context)
      slots: [8, 4]          # speculation helps single streams most, so also try it with fewer parallel attempts
      min_gain: 1.05         # use speculation only if it beats plain decoding by at least 5 % in throughput
      min_agreement: 0.95    # greedy tokens must match plain decoding this closely (tiny float differences allowed)
      args: ["--spec-draft-ngl", "all"]
  cuda_mid:                  # NVIDIA GPU with 10-14 GB, e.g. RTX 2080 Ti (11 GB) / RTX 3060 (12 GB)
    train_repo: IFM/K2-Horizon-3.7B           # same family / chat format as the cpu profile's K2-Horizon-7B
    gguf_repo: IFM/K2-Horizon-3.7B-GGUF
    gguf_file: K2-Horizon-4B-Q4_K_M.gguf      # (IFM names the 3.7B GGUF files "4B")
    trust_remote_code: true
    reasoning_effort: low
    quant_4bit: true         # QLoRA: ~1.9 GB of 4-bit layers + ~2.6 GB of 16-bit embeddings/output layer
    dtype: float16           # Turing (RTX 20xx) has no native bf16; fp16 + loss scaling instead
    optimizer: paged_adamw_8bit
    offload_trainer_during_rollouts: true
    llama_build: cuda
    llama_gpu_layers: auto   # llama.cpp fits as many layers as free VRAM allows (the trainer also lives there)
    parallel_slots: 2
    swap_engine_during_training: true          # stop llama-server while training to give activations room
    max_seq_len: 6144
    ctx_per_slot: 6144
  cuda_small:                # NVIDIA GPU with 8-10 GB or 14-24 GB
    train_repo: unsloth/Qwen3.5-4B
    gguf_repo: unsloth/Qwen3.5-4B-GGUF
    gguf_file: Qwen3.5-4B-Q4_K_M.gguf
    quant_4bit: true
    dtype: bfloat16
    optimizer: paged_adamw_8bit
    llama_build: cuda
    llama_gpu_layers: all
    parallel_slots: 4
    swap_engine_during_training: true
    max_seq_len: 10240
    ctx_per_slot: 10240
  cpu:                       # no NVIDIA GPU, >= 28 GB RAM (e.g. the OptiPlex with 32 GB): K2-Horizon-7B
    train_repo: IFM/K2-Horizon-7B             # dense 7B, ships its own model code (trust_remote_code)
    gguf_repo: IFM/K2-Horizon-7B-GGUF
    gguf_file: K2-Horizon-7B-Q4_K_M.gguf
    trust_remote_code: true
    reasoning_effort: low    # K2: high/medium/low -> <ifm|think>/<ifm|think_fast>/<ifm|think_faster>; low keeps CPU steps shorter
    quant_4bit: false        # bitsandbytes 4-bit needs CUDA, so plain LoRA
    dtype: bfloat16          # fp32 would need 36 GB for the weights alone; bf16 is 18 GB
    llama_build: cpu
    llama_gpu_layers: 0
    parallel_slots: 2
    swap_engine_during_training: true          # stop llama-server while training to free ~6 GB of RAM
    max_seq_len: 8192
    ctx_per_slot: 8192
  cpu_small:                 # no NVIDIA GPU, 14-28 GB RAM, or when K2-Horizon-7B steps are too slow
    train_repo: unsloth/Qwen3.5-2B
    gguf_repo: unsloth/Qwen3.5-2B-GGUF
    gguf_file: Qwen3.5-2B-Q4_K_M.gguf
    quant_4bit: false
    dtype: float32           # 12th-gen Intel CPUs have no fast bf16
    llama_build: cpu
    llama_gpu_layers: 0
    parallel_slots: 4
    swap_engine_during_training: false
    max_seq_len: 8192
    ctx_per_slot: 8192
  cpu_tiny:                  # no GPU and < 14 GB RAM, or when you want the fastest steps on CPU
    train_repo: unsloth/Qwen3.5-0.8B
    gguf_repo: unsloth/Qwen3.5-0.8B-GGUF
    gguf_file: Qwen3.5-0.8B-Q4_K_M.gguf
    quant_4bit: false
    dtype: float32
    llama_build: cpu
    llama_gpu_layers: 0
    parallel_slots: 4
    swap_engine_during_training: false
    max_seq_len: 8192
    ctx_per_slot: 8192

engine: auto                 # auto = use setup's self-test result; llamacpp | hf

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  use_rslora: true
  target_modules: all        # all = attention + Gated-DeltaNet projections + MLP; mlp_only if llama.cpp rejects the rest

optim:
  lr_solver: 2.0e-5          # LoRA RL learning rates are ~10x higher than full fine-tuning
  lr_maker: 1.0e-5
  weight_decay: 0.0
  grad_clip: 1.0

grpo:
  puzzles_per_step: 4        # M: how many puzzles the Maker writes each step
  solver_attempts: 4         # G: Solver attempts per puzzle = GRPO group size (p_hat in {0, .25, .5, .75, 1})
  ppo_epochs: 1              # 1 = purely on-policy (ratio is always 1); >1 enables PPO clipping
  clip_eps: 0.2
  kl_beta: 0.0               # >0 adds a KL penalty to the frozen base (adapters off). 0 like DAPO/Dr.GRPO
  scale_by_std: true
  maker_baseline: batch      # the Maker has no natural group, so its baseline is the step's batch mean

generation:
  enable_thinking: true
  reasoning_effort: low      # Qwen3.8: xhigh|medium|low, K2-Horizon: high|medium|low, ignored by Qwen3.5 (a profile can override)
  maker:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    think_budget: 768
    max_new_tokens: 3072
  solver:
    temperature: 0.8
    top_p: 0.95
    top_k: 20
    think_budget: 512
    max_new_tokens: 1536     # per turn

overthinking_bias:
  enabled: true
  roles: [maker, solver]
  scope: thinking            # only inside <think>; " or" / " error" are everywhere in real code
  file: data/overthinking_markers.json

solver:
  use_pi: true               # false = single-shot answer in a ```python block (much faster)
  pi_tools: read,write,edit,bash
  max_turns: 4               # model calls per attempt before the proxy ends the episode (read, write, test, fix)
  timeout_s: 900
  visible_tests: 3           # examples shown in PROBLEM.md; grading uses all tests

sandbox:
  timeout_s: 10
  max_memory_mb: 2048

rewards:
  maker_invalid: -1.0
  similarity_penalty: 0.5
  similarity_free: 0.3       # puzzles less similar than this to recent ones are not penalised
  full_pass_bonus: 0.5

decision:
  every: 10                  # consult the referee every N steps
  backend: auto              # auto = d3-flash if its GGUF is present and RAM allows, else rules; d3 | rules
  d3_repo: ggml-org/vllm-d3-flash-GGUF
  d3_file: vllm-d3-flash-Q4_K_M.gguf
  gpu_layers: 0              # run d3 on CPU so it never competes with training for VRAM
  keep_loaded: false
  stall_threshold: 0.6       # act only if P(stalled) >= this
  cooldown_steps: 15         # at least this many steps between two interventions
  inject_steps: 5
  start_difficulty: 2
  maker_temperature: 1.0

ports:
  engine: 8181
  proxy: 8282
  d3: 8383
